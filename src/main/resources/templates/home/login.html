<!DOCTYPE html>
<html lang="vi" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - _5theway</title>
</head>
<body>
<section layout:fragment="content">
    <main class="auth-page" style="padding: 100px 0; background: #f9f9f9;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="auth-card" style="background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                        <h2 class="text-center mb-4" style="font-family: 'Be Vietnam Pro', sans-serif; font-size: 2.5rem; letter-spacing: 2px;">ĐĂNG NHẬP</h2>
                        
                        <!-- Thông báo -->
                        <div th:if="${param.error}">
                            <div th:if="${session['SPRING_SECURITY_LAST_EXCEPTION'] != null and session['SPRING_SECURITY_LAST_EXCEPTION'].class.name == 'org.springframework.security.authentication.DisabledException'}" class="alert alert-danger">
                                Tài khoản của bạn đã bị khóa, vui lòng liên hệ với Quản trị viên!
                            </div>
                            <div th:unless="${session['SPRING_SECURITY_LAST_EXCEPTION'] != null and session['SPRING_SECURITY_LAST_EXCEPTION'].class.name == 'org.springframework.security.authentication.DisabledException'}" class="alert alert-danger">
                                Tên đăng nhập hoặc mật khẩu không đúng!
                            </div>
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info">Bạn đã đăng xuất thành công.</div>
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                        <form th:action="@{/login}" method="post">
                            <div class="form-group mb-3">
                                <label for="username">Tên đăng nhập</label>
                                <input type="text" name="username" id="username" class="form-control" placeholder="Tên đăng nhập" required style="border-radius: 8px;">
                            </div>
                            <div class="form-group mb-4">
                                <label for="password">Mật khẩu</label>
                                <input type="password" name="password" id="password" class="form-control" placeholder="Mật khẩu" required style="border-radius: 8px;">
                            </div>
                            
                            <button type="submit" class="btn btn-dark btn-block" style="padding: 12px; border-radius: 8px; font-weight: 600; letter-spacing: 1px;">ĐĂNG NHẬP</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted" style="font-size: 0.9rem;">Chưa có tài khoản? <a th:href="@{/register}" style="color: #000; font-weight: 600; text-decoration: underline;">Đăng ký ngay</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</section>
</body>
</html>
