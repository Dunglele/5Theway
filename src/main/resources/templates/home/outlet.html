<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Outlet - _5theway</title>
    <style>
        .color-swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 5px 0; }
        .color-swatch { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #ddd; cursor: pointer; transition: transform 0.2s; }
        .color-swatch:hover { transform: scale(1.2); }
        .filter-cat-list { list-style: none; padding: 0; margin: 0; }
        .filter-cat-list li a { display: block; padding: 6px 0; color: var(--gray-muted); font-size: 13px; transition: color 0.2s; }
        .filter-cat-list li a:hover, .filter-cat-list li a.active { color: var(--black); font-weight: 600; }
        .filter-cat-list li a .count { float: right; opacity: 0.5; font-weight: 400; }
    </style>
</head>
<body>
<section layout:fragment="content">
    <main>
        <div class="container-xl px-3 px-md-4" style="padding-top:20px;padding-bottom:60px;">

            <div class="cat-toolbar">
                <div class="cat-toolbar__left">
                    <button class="btn-filter-toggle active" id="filterToggle">
                        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
                        </svg>
                        Bộ lọc
                    </button>
                    <span class="result-count" th:text="${#lists.size(products)} + ' sản phẩm'">0 sản phẩm</span>
                </div>
                <div class="cat-toolbar__right">
                    <form id="sortForm" method="get" th:action="@{/Home/Outlet}">
                        <input type="hidden" name="minPrice" th:value="${minPrice}">
                        <input type="hidden" name="maxPrice" th:value="${maxPrice}">
                        <select class="sort-select" name="sort" onchange="this.form.submit()">
                            <option value="default" th:selected="${sort == 'default'}">Mặc định</option>
                            <option value="priceAsc" th:selected="${sort == 'priceAsc'}">Giá: Thấp → Cao</option>
                            <option value="priceDesc" th:selected="${sort == 'priceDesc'}">Giá: Cao → Thấp</option>
                            <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
                        </select>
                    </form>
                </div>
            </div>

            <div class="cat-layout">
                <!-- SIDEBAR -->
                <aside class="filter-sidebar" id="filterSidebar">
                    <div class="filter-sidebar__header">
                        <h2 class="filter-sidebar__title">Bộ lọc</h2>
                        <a th:href="@{/Home/Outlet}" class="btn-clear-all">Xoá tất cả</a>
                    </div>

                    <form id="mainFilterForm" method="get" th:action="@{/Home/Outlet}">
                        <!-- Giữ lại tham số sắp xếp hiện tại -->
                        <input type="hidden" name="sort" th:value="${sort}">
                        <!-- Input ẩn để lưu màu sắc đang chọn -->
                        <input type="hidden" name="color" id="hiddenColor" th:value="${color}">

                        <!-- Category Filter -->
                        <div class="filter-group open">
                            <button class="filter-group__trigger" type="button" onclick="toggleFilterGroup(this)">
                                Danh mục
                                <svg class="filter-group__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:12px; margin-left:auto;"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <div class="filter-group__body">
                                <ul class="filter-cat-list">
                                    <li><a th:href="@{/Home/Outlet}" class="active">Tất cả OUTLET</a></li>
                                    <li th:each="cat : ${categories}">
                                        <a th:href="@{'/Home/' + ${#strings.capitalize(cat.slug)}}">
                                            <span th:text="${cat.name}">Danh mục</span>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <!-- Color Filter -->
                        <div class="filter-group open">
                            <button class="filter-group__trigger" type="button" onclick="toggleFilterGroup(this)">
                                Màu sắc
                                <svg class="filter-group__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:12px; margin-left:auto;"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <div class="filter-group__body">
                                <div class="color-swatches">
                                    <div class="color-swatch" th:classappend="${color == 'Black' ? 'active-border' : ''}" style="background:#0a0a0a;" title="BLACK" data-color="Black" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'White' ? 'active-border' : ''}" style="background:#f8f8f6;border-color:#ccc;" title="WHITE" data-color="White" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'Gold' ? 'active-border' : ''}" style="background:#d4a017;" title="GOLD" data-color="Gold" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'Caramel' ? 'active-border' : ''}" style="background:#8b6914;" title="CARAMEL" data-color="Caramel" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'Purple' ? 'active-border' : ''}" style="background:#7c3aed;" title="PURPLE" data-color="Purple" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'Pink' ? 'active-border' : ''}" style="background:#f9a8d4;" title="PINK" data-color="Pink" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'Blue' ? 'active-border' : ''}" style="background:#3b82f6;" title="BLUE" data-color="Blue" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'Red' ? 'active-border' : ''}" style="background:#dc2626;" title="RED" data-color="Red" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'Grey' ? 'active-border' : ''}" style="background:#9ca3af;" title="GREY" data-color="Grey" onclick="selectColor(this)"></div>
                                    <div class="color-swatch" th:classappend="${color == 'Khaki' ? 'active-border' : ''}" style="background:#d1c5b0;" title="KHAKI" data-color="Khaki" onclick="selectColor(this)"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Price Filter -->
                        <div class="filter-group open">
                            <button class="filter-group__trigger" type="button" onclick="toggleFilterGroup(this)">
                                Khoảng giá
                                <svg class="filter-group__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:12px; margin-left:auto;"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <div class="filter-group__body">
                                <div class="price-range-inputs">
                                    <input type="number" name="minPrice" th:value="${minPrice}" placeholder="Từ" min="0" step="10000" />
                                    <span class="price-dash">—</span>
                                    <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="Đến" min="0" step="10000" />
                                </div>
                            </div>
                        </div>

                        <!-- Status Filter -->
                        <div class="filter-group open">
                            <button class="filter-group__trigger" type="button" onclick="toggleFilterGroup(this)">
                                Tình trạng
                                <svg class="filter-group__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:12px; margin-left:auto;"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <div class="filter-group__body">
                                <ul class="filter-cat-list">
                                    <li>
                                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--gray-muted);padding:7px 0;">
                                            <input type="radio" name="status" value="inStock" th:checked="${status == 'inStock'}" style="accent-color:var(--black);width:14px;height:14px;" /> Còn hàng
                                        </label>
                                    </li>
                                    <li>
                                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--gray-muted);padding:7px 0;">
                                            <input type="radio" name="status" value="lowStock" th:checked="${status == 'lowStock'}" style="accent-color:var(--black);width:14px;height:14px;" /> Sắp hết hàng
                                        </label>
                                    </li>
                                    <li>
                                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--gray-muted);padding:7px 0;">
                                            <input type="radio" name="status" value="" th:checked="${status == null or status == ''}" style="accent-color:var(--black);width:14px;height:14px;" /> Tất cả
                                        </label>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <button type="submit" class="btn-apply-filter mt-4" style="width:100%; padding: 12px; background: #000; color: #fff; border:none; border-radius: 8px; font-weight:700; font-size: 13px; letter-spacing: 1px;">ÁP DỤNG BỘ LỌC</button>
                    </form>
                </aside>

                <!-- PRODUCTS -->
                <section style="flex:1;">
                    <div th:if="${#lists.isEmpty(products)}" class="py-5 text-center">
                        <p class="text-muted">Không tìm thấy sản phẩm nào phù hợp với bộ lọc hiện tại.</p>
                        <a th:href="@{/Home/Outlet}" class="btn btn-outline-dark btn-sm mt-2">Xóa tất cả bộ lọc</a>
                    </div>
                    <div class="products-grid grid-4">
                        <th:block th:each="product : ${products}">
                            <article class="product-card">
                                <a th:href="@{'/Home/Product/' + ${product.id}}" class="product-card__img-wrap d-block">
                                    <img th:src="${product.mainImageUrl}" th:alt="${product.name}" loading="lazy" />
                                    <span th:if="${product.stock < 15}" class="product-card__badge badge-low">Sắp hết</span>
                                    <span th:if="${product.newArrival}" class="product-card__badge badge-new" th:unless="${product.stock < 15}">New</span>
                                </a>
                                <div class="product-card__body">
                                    <h3 class="product-card__name" th:text="${product.name}">Product Name</h3>
                                    <div class="product-card__price-row">
                                        <span class="product-card__price" th:text="${#numbers.formatDecimal(product.salePrice != null ? product.salePrice : product.price, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</span>
                                        <span class="product-card__old-price" th:if="${product.salePrice != null}" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</span>
                                    </div>
                                </div>
                                <div class="product-card__footer">
                                    <a th:href="@{'/Home/Product/' + ${product.id}}" class="btn-add-cart" style="text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px;">
                                        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c3.55 0 6.715 1.832 8.542 4.636a2 2 0 010 2.728C18.715 15.168 15.55 17 12 17c-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                        Xem chi tiết
                                    </a>
                                </div>
                            </article>
                        </th:block>
                    </div>
                </section>
            </div>
        </div>
    </main>
</section>

<th:block layout:fragment="scripts">
    <script>
        document.getElementById('filterToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('filterSidebar');
            sidebar.classList.toggle('active');
            this.classList.toggle('active');
        });

        function toggleFilterGroup(button) {
            const group = button.parentElement;
            group.classList.toggle('open');
        }

        function selectColor(element) {
            const color = element.getAttribute('data-color');
            const hiddenInput = document.getElementById('hiddenColor');
            
            // Nếu nhấn vào màu đã chọn -> Bỏ chọn
            if (hiddenInput.value === color) {
                hiddenInput.value = "";
                element.classList.remove('active-border');
            } else {
                // Bỏ border của màu cũ
                document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active-border'));
                // Chọn màu mới
                hiddenInput.value = color;
                element.classList.add('active-border');
            }
        }
    </script>
    <style>
        .color-swatch.active-border {
            outline: 2px solid var(--black);
            outline-offset: 2px;
            transform: scale(1.1);
        }
    </style>
</th:block>
</body>
</html>
