<!DOCTYPE html>
<html lang="vi" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - _5theway</title>
</head>
<body>
<section layout:fragment="content">
    <main class="auth-page" style="padding: 100px 0; background: #f9f9f9;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="auth-card" style="background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                        <h2 class="text-center mb-4" style="font-family: 'Be Vietnam Pro', sans-serif; font-size: 2.5rem; letter-spacing: 2px;">ĐĂNG KÝ</h2>
                        
                        <!-- Thông báo lỗi/thành công -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                        <form th:action="@{/register}" th:object="${user}" method="post">
                            <div class="form-group mb-3">
                                <label for="fullName">Họ và tên</label>
                                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Nhập họ và tên" required style="border-radius: 8px;">
                            </div>
                            <div class="form-group mb-3">
                                <label for="username">Tên đăng nhập</label>
                                <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Chọn tên đăng nhập" required style="border-radius: 8px;">
                            </div>
                            <div class="form-group mb-3">
                                <label for="email">Email</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="example@gmail.com" required style="border-radius: 8px;">
                            </div>
                            <div class="form-group mb-3">
                                <label for="password">Mật khẩu</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="********" required style="border-radius: 8px;">
                            </div>
                            <div class="form-group mb-4">
                                <label for="confirmPassword">Xác nhận mật khẩu</label>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="********" required style="border-radius: 8px;">
                            </div>
                            
                            <button type="submit" class="btn btn-dark btn-block" style="padding: 12px; border-radius: 8px; font-weight: 600; letter-spacing: 1px;">TẠO TÀI KHOẢN</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted" style="font-size: 0.9rem;">Đã có tài khoản? <a th:href="@{/login}" style="color: #000; font-weight: 600; text-decoration: underline;">Đăng nhập ngay</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</section>
</body>
</html>
