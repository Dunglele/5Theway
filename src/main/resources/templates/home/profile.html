<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Hồ sơ cá nhân - _5theway</title>
    <style>
        .profile-container { padding: 80px 0; background: #fafafa; min-height: 100vh; }
        
        /* Profile Card */
        .profile-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            border: 1px solid #f0f0f0;
        }
        
        .profile-header {
            background: #000;
            padding: 60px 40px;
            color: #fff;
            text-align: center;
            position: relative;
        }
        .profile-avatar-wrap {
            width: 110px;
            height: 110px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #000;
            border: 4px solid rgba(255,255,255,0.2);
        }
        .profile-name {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .profile-role {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .profile-body {
            padding: 40px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .info-item {
            padding: 20px;
            background: #fdfdfd;
            border: 1px solid #f5f5f5;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .info-item:hover {
            border-color: #000;
            transform: translateY(-3px);
        }
        .info-label {
            font-size: 0.7rem;
            font-weight: 800;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }
        .info-value {
            font-size: 1rem;
            font-weight: 600;
            color: #000;
            word-break: break-word;
        }
        .info-icon {
            margin-bottom: 15px;
            color: #000;
            background: #eee;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-address { grid-column: span 2; }

        /* Action Buttons */
        .profile-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding-top: 30px;
            border-top: 1px solid #f0f0f0;
        }
        .btn-profile {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .btn-profile-dark { background: #000; color: #fff; border: none; }
        .btn-profile-dark:hover { background: #333; transform: scale(1.02); }
        
        .btn-profile-outline { background: #fff; color: #000; border: 1px solid #ddd; }
        .btn-profile-outline:hover { border-color: #000; background: #fafafa; }

        @media (max-width: 575px) {
            .profile-header { padding: 40px 20px; }
            .profile-body { padding: 30px 20px; }
            .btn-profile { width: 100%; justify-content: center; }
            .info-address { grid-column: span 1; }
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <main class="profile-container">
        <div class="container-xl px-3">
            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4 border-0 shadow-sm" role="alert" style="border-radius: 10px;">
                <strong th:text="${success}">Thành công!</strong>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4 border-0 shadow-sm" role="alert" style="border-radius: 10px;">
                <strong th:text="${error}">Lỗi!</strong>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="profile-card">
                        <!-- Header -->
                        <div class="profile-header">
                            <div class="profile-avatar-wrap" th:text="${#strings.substring(user.fullName != null and !user.fullName.empty ? user.fullName : user.username, 0, 1)}">A</div>
                            <h1 class="profile-name" th:text="${user.fullName != null and !user.fullName.empty ? user.fullName : user.username}">Full Name</h1>
                            <p class="profile-role" th:text="${#strings.contains(user.roles, 'ROLE_ADMIN') ? 'Quản trị viên' : (#strings.contains(user.roles, 'ROLE_STAFF') ? 'Nhân viên' : 'Khách hàng thân thiết')}">ROLE</p>
                        </div>

                        <!-- Body -->
                        <div class="profile-body">
                            <div class="info-grid">
                                <!-- Email -->
                                <div class="info-item">
                                    <div class="info-icon">
                                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 0 0 2.22 0L21 8M5 19h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"/></svg>
                                    </div>
                                    <span class="info-label">Địa chỉ Email</span>
                                    <div class="info-value" th:text="${user.email}">user@example.com</div>
                                </div>

                                <!-- Phone -->
                                <div class="info-item">
                                    <div class="info-icon">
                                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.74 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                    </div>
                                    <span class="info-label">Số điện thoại</span>
                                    <div class="info-value" th:text="${user.phoneNumber != null and !user.phoneNumber.empty ? user.phoneNumber : 'Chưa cập nhật'}">0123456789</div>
                                </div>

                                <!-- Address -->
                                <div class="info-item info-address">
                                    <div class="info-icon">
                                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                    </div>
                                    <span class="info-label">Địa chỉ giao hàng</span>
                                    <div class="info-value" th:text="${user.address != null and !user.address.empty ? user.address : 'Chưa cập nhật địa chỉ'}">Số 123...</div>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="profile-actions">
                                <a href="/Home/Orders" class="btn-profile btn-profile-dark">
                                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 11V7a4 4 0 0 0-8 0v4M5 9h12l1 12H4L5 9z"/></svg>
                                    LỊCH SỬ ĐƠN HÀNG
                                </a>
                                <button class="btn-profile btn-profile-outline" data-toggle="modal" data-target="#editInfoModal">
                                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    CHỈNH SỬA THÔNG TIN
                                </button>
                                <button class="btn-profile btn-profile-outline" data-toggle="modal" data-target="#changePasswordModal">
                                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
                                    ĐỔI MẬT KHẨU
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Edit Info -->
    <div class="modal fade" id="editInfoModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0 pt-4 px-4">
                    <h5 class="modal-title font-weight-bold">CHỈNH SỬA HỒ SƠ</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form th:action="@{/Home/Profile/Update}" method="post">
                    <div class="modal-body p-4">
                        <div class="form-group mb-3">
                            <label class="small font-weight-bold text-uppercase">Họ và tên</label>
                            <input type="text" name="fullName" th:value="${user.fullName}" class="form-control" placeholder="Nhập họ tên đầy đủ" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="small font-weight-bold text-uppercase">Số điện thoại</label>
                            <input type="text" name="phoneNumber" th:value="${user.phoneNumber}" class="form-control" placeholder="Số điện thoại liên hệ" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="small font-weight-bold text-uppercase">Địa chỉ giao hàng</label>
                            <textarea name="address" class="form-control" rows="3" placeholder="Địa chỉ nhận hàng mặc định" th:text="${user.address}" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pb-4 px-4">
                        <button type="submit" class="btn btn-dark w-100 py-3 font-weight-bold" style="border-radius: 10px;">LƯU THAY ĐỔI</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Change Password -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0 pt-4 px-4">
                    <h5 class="modal-title font-weight-bold">ĐỔI MẬT KHẨU</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form th:action="@{/Home/Profile/ChangePassword}" method="post">
                    <div class="modal-body p-4">
                        <div class="form-group mb-3">
                            <label class="small font-weight-bold text-uppercase">Mật khẩu hiện tại</label>
                            <input type="password" name="oldPassword" class="form-control" required>
                        </div>
                        <hr class="my-4">
                        <div class="form-group mb-3">
                            <label class="small font-weight-bold text-uppercase">Mật khẩu mới</label>
                            <input type="password" name="newPassword" class="form-control" required>
                        </div>
                        <div class="form-group mb-3">
                            <label class="small font-weight-bold text-uppercase">Xác nhận mật khẩu mới</label>
                            <input type="password" name="confirmPassword" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pb-4 px-4">
                        <button type="submit" class="btn btn-dark w-100 py-3 font-weight-bold" style="border-radius: 10px;">CẬP NHẬT MẬT KHẨU</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</section>
</body>
</html>
