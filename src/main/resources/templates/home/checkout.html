<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thanh toán - _5theway</title>
    <style>
        .checkout-page { padding: 60px 0 100px; background: #fafafa; min-height: 100vh; }
        .checkout-header { margin-bottom: 50px; text-align: center; }
        .checkout-title { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 800; font-size: 2.2rem; letter-spacing: -1px; }

        .checkout-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); border: 1px solid #eee; }
        .section-label { font-size: 0.75rem; font-weight: 800; color: #000; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 25px; display: block; border-left: 3px solid #000; padding-left: 12px; }
        
        .form-group label { font-size: 0.8rem; font-weight: 700; color: #555; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .form-control { 
            height: 50px; border-radius: 6px; border: 1px solid #ddd; padding: 10px 15px; 
            font-size: 0.95rem; transition: all 0.2s; width: 100%;
        }
        .form-control:focus { border-color: #000; box-shadow: none; outline: none; }
        textarea.form-control { height: auto; min-height: 100px; }

        .pay-method-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .pay-method-item { 
            border: 1px solid #eee; border-radius: 8px; padding: 15px; cursor: pointer; 
            text-align: center; transition: all 0.2s; position: relative;
        }
        .pay-method-item:hover { border-color: #000; }
        .pay-method-item.active { border-color: #000; background: #fafafa; }
        .pay-method-item input { position: absolute; opacity: 0; }
        .pay-method-icon { font-size: 1.5rem; margin-bottom: 8px; display: block; }
        .pay-method-name { font-size: 0.8rem; font-weight: 700; display: block; }

        .order-summary-card { background: #fff; padding: 35px; border-radius: 12px; border: 1px solid #000; position: sticky; top: 110px; }
        .summary-item { display: grid; grid-template-columns: 60px 1fr auto; gap: 15px; margin-bottom: 20px; align-items: center; }
        .item-img { width: 60px; height: 75px; object-fit: cover; border-radius: 4px; background: #f9f9f9; }
        .item-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; line-height: 1.2; color: #000; }
        .item-meta { font-size: 0.75rem; color: #888; }
        .item-price { font-weight: 700; font-size: 0.9rem; }

        .summary-divider { height: 1px; background: #eee; margin: 25px 0; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color: #555; }
        .summary-row.total { font-weight: 800; font-size: 1.3rem; color: #000; margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0; }

        .btn-place-order { 
            background: #000; color: #fff; width: 100%; height: 56px; border: none; 
            border-radius: 6px; font-weight: 800; font-size: 0.9rem; letter-spacing: 1px; 
            margin-top: 30px; transition: all 0.3s; cursor: pointer;
        }
        .btn-place-order:hover { background: #333; transform: translateY(-2px); }

        @media (max-width: 991px) {
            .order-summary-card { margin-top: 40px; position: static; }
        }

        @media (max-width: 575px) {
            .pay-method-wrap { grid-template-columns: 1fr; }
            .summary-item { grid-template-columns: 60px 1fr; }
            .item-price { grid-column: span 2; text-align: right; margin-top: 5px; padding-top: 10px; border-top: 1px dashed #eee; }
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <main class="checkout-page">
        <div class="container-xl px-4 px-md-5">
            
            <div class="checkout-header">
                <h1 class="checkout-title">THANH TOÁN</h1>
                <p class="text-muted small uppercase">Cung cấp thông tin nhận hàng để hoàn tất đơn hàng</p>
            </div>

            <form th:action="@{/Home/Checkout/PlaceOrder}" th:object="${order}" method="post" id="checkoutForm">
                <div class="row">
                    <!-- Left: Shipping Info -->
                    <div class="col-lg-7">
                        <div class="checkout-card">
                            <span class="section-label">THÔNG TIN GIAO HÀNG</span>
                            
                            <div class="row">
                                <div class="col-md-12 form-group mb-4">
                                    <label for="fullName">Họ và tên người nhận</label>
                                    <input type="text" th:field="*{fullName}" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
                                </div>
                                
                                <div class="col-md-6 form-group mb-4">
                                    <label for="phoneNumber">Số điện thoại</label>
                                    <input type="text" th:field="*{phoneNumber}" class="form-control" id="phoneNumber" placeholder="Số điện thoại liên hệ" required>
                                </div>
                                
                                <div class="col-md-6 form-group mb-4">
                                    <label for="email">Địa chỉ Email</label>
                                    <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="Để nhận thông tin đơn hàng" required>
                                </div>
                                
                                <div class="col-md-12 form-group mb-4">
                                    <label for="shippingAddress">Địa chỉ nhận hàng</label>
                                    <textarea th:field="*{shippingAddress}" class="form-control" id="shippingAddress" rows="3" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố" required></textarea>
                                </div>

                                <div class="col-md-12 form-group">
                                    <label>Phương thức thanh toán</label>
                                    <div class="pay-method-wrap">
                                        <label class="pay-method-item active" onclick="selectPay(this)">
                                            <input type="radio" th:field="*{paymentMethod}" value="COD" checked>
                                            <span class="pay-method-icon">📦</span>
                                            <span class="pay-method-name">Tiền mặt (COD)</span>
                                        </label>
                                        <label class="pay-method-item" onclick="selectPay(this)">
                                            <input type="radio" th:field="*{paymentMethod}" value="BANK">
                                            <span class="pay-method-icon">🏦</span>
                                            <span class="pay-method-name">Chuyển khoản</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Summary -->
                    <div class="col-lg-5 col-xl-4 offset-xl-1">
                        <div class="order-summary-card">
                            <h2 class="summary-title">TỔNG ĐƠN HÀNG</h2>
                            
                            <div class="summary-items-list" th:if="${cartItems != null}">
                                <div th:each="item : ${cartItems}" class="summary-item">
                                    <img th:src="${item.imageUrl}" th:alt="${item.name}" class="item-img">
                                    <div class="item-info">
                                        <p class="item-name" th:text="${item.name}">Name</p>
                                        <p class="item-meta">
                                            <span th:text="${item.color}">Màu</span> / <span th:text="${item.size}">Size</span> 
                                            x <span th:text="${item.quantity}">1</span>
                                        </p>
                                    </div>
                                    <span class="item-price" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</span>
                                </div>
                            </div>

                            <div class="summary-divider"></div>

                            <div class="summary-row">
                                <span>Tạm tính</span>
                                <span th:text="${#numbers.formatDecimal(totalAmount, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</span>
                            </div>
                            
                            <div class="summary-row" th:if="${discount != null and discount > 0}">
                                <span>Giảm giá</span>
                                <span class="text-success" th:text="'-' + ${#numbers.formatDecimal(discount, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</span>
                            </div>

                            <div class="summary-row">
                                <span>Phí vận chuyển</span>
                                <span th:text="${totalAmount >= 500000 ? 'MIỄN PHÍ' : '30.000đ'}">0đ</span>
                            </div>

                            <div class="summary-row total">
                                <span>TỔNG CỘNG</span>
                                <span th:text="${#numbers.formatDecimal(totalAmount - (discount != null ? discount : 0) + (totalAmount >= 500000 ? 0 : 30000), 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</span>
                            </div>

                            <button type="submit" class="btn-place-order">HOÀN TẤT ĐẶT HÀNG</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
</section>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        function selectPay(element) {
            document.querySelectorAll('.pay-method-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            element.querySelector('input').checked = true;
        }

        // Autocomplete logic
        document.addEventListener('DOMContentLoaded', function() {
            const user = /*[[${currentUser}]]*/ null;
            if (user) {
                if (user.fullName) document.getElementById('fullName').value = user.fullName;
                if (user.phoneNumber) document.getElementById('phoneNumber').value = user.phoneNumber;
                if (user.email) document.getElementById('email').value = user.email;
                if (user.address) document.getElementById('shippingAddress').value = user.address;
            }
        });
    </script>
</th:block>
</body>
</html>
