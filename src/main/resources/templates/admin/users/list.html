<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý người dùng - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 style="font-weight: 800; letter-spacing: -1px;">QUẢN LÝ NGƯỜI DÙNG</h2>
            <p class="text-muted small m-0">Danh sách tài khoản khách hàng và quản trị viên trên hệ thống.</p>
        </div>
        <div class="d-flex">
            <form method="get" class="form-inline m-0 mr-2">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control mr-2" placeholder="Tìm kiếm mã hoặc tên...">
                <button class="btn btn-outline-dark" type="submit">Tìm</button>
            </form>
            <a th:href="@{/admin/users/add}" class="btn btn-admin btn-admin-primary">Thêm mới</a>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th class="pl-4">Người dùng</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th class="text-right pr-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="pl-4">
                                <div class="d-flex align-items-center">
                                    <div class="bg-dark text-white rounded-circle mr-3 d-flex align-items-center justify-content-center" style="width:35px; height:35px; font-weight:800; font-size: 0.8rem;" th:text="${#strings.substring(user.username, 0, 1)}">U</div>
                                    <div>
                                        <div style="font-weight: 700; color: #000;" th:text="${user.username}">Username</div>
                                        <small class="text-muted" th:text="${user.fullName}">Full Name</small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${user.email}">email@example.com</td>
                            <td>
                                <th:block th:each="role : ${user.roles}">
                                    <span class="badge badge-light p-2 mr-1" th:text="${role}">ROLE</span>
                                </th:block>
                            </td>
                            <td>
                                <span th:if="${user.enabled}" class="text-success small font-weight-bold">● Đang hoạt động</span>
                                <span th:unless="${user.enabled}" class="text-danger small font-weight-bold">● Đã khóa</span>
                            </td>
                            <td class="text-right pr-4 d-flex justify-content-end align-items-center">
                                <button class="btn btn-sm btn-outline-primary mr-2 font-weight-bold" data-toggle="modal" th:attr="data-target='#changePasswordModal' + ${user.id}">ĐỔI MK</button>
                                <form th:action="@{/admin/users/toggle-status}" method="post" class="m-0">
                                    <input type="hidden" name="userId" th:value="${user.id}">
                                    <button type="submit" class="btn btn-sm font-weight-bold" 
                                            th:classappend="${user.enabled ? 'btn-outline-danger' : 'btn-outline-success'}"
                                            th:text="${user.enabled ? 'KHÓA' : 'MỞ KHÓA'}">Action</button>
                                </form>
                                
                                <!-- Modal Đổi mật khẩu -->
                                <div class="modal fade" th:id="'changePasswordModal' + ${user.id}" tabindex="-1" role="dialog" aria-hidden="true">
                                    <div class="modal-dialog" role="document">
                                        <div class="modal-content text-left">
                                            <form th:action="@{/admin/users/change-password}" method="post">
                                                <div class="modal-header">
                                                    <h5 class="modal-title font-weight-bold">Đổi mật khẩu: <span th:text="${user.username}"></span></h5>
                                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                        <span aria-hidden="true">&times;</span>
                                                    </button>
                                                </div>
                                                <div class="modal-body">
                                                    <input type="hidden" name="userId" th:value="${user.id}">
                                                    <div class="form-group">
                                                        <label>Mật khẩu mới</label>
                                                        <input type="password" name="newPassword" class="form-control" required minlength="6" placeholder="Nhập mật khẩu mới (ít nhất 6 ký tự)">
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Hủy</button>
                                                    <button type="submit" class="btn btn-dark">Lưu Mật Khẩu</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <nav th:if="${totalPages > 1}" class="mt-4 mb-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, page=${currentPage - 1})}">Trang trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, page=${i})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, page=${currentPage + 1})}">Trang sau</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</section>
</body>
</html>
