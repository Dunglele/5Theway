<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Thêm mới người dùng - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-4">
        <h2 style="font-weight: 800; letter-spacing: -1px;">THÊM NGƯỜI DÙNG</h2>
        <p class="text-muted small m-0">Tạo mới tài khoản Khách hàng hoặc Nhân viên (Staff).</p>
    </div>

    <!-- Thông báo lỗi (nếu có) -->
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
    
    <div class="card" style="max-width: 600px;">
        <div class="card-body p-4">
            <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
                <div class="form-group mb-3">
                    <label class="font-weight-bold small text-uppercase">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{username}" required>
                </div>
                
                <div class="form-group mb-3">
                    <label class="font-weight-bold small text-uppercase">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" th:field="*{password}" required>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold small text-uppercase">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" th:field="*{email}" required>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold small text-uppercase">Họ và Tên</label>
                    <input type="text" class="form-control" th:field="*{fullName}">
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold small text-uppercase">Vai trò <span class="text-danger">*</span></label>
                    <select name="role" class="form-control custom-select" required>
                        <option value="ROLE_USER">Khách hàng (ROLE_USER)</option>
                        <option value="ROLE_STAFF">Nhân viên (ROLE_STAFF)</option>
                    </select>
                    <small class="text-muted mt-1 d-block">Nhân viên chỉ có quyền quản lý Danh mục, Sản phẩm, Đơn hàng và Đánh giá.</small>
                </div>

                <div class="d-flex justify-content-end pt-3 border-top">
                    <a th:href="@{/admin/users}" class="btn btn-light mr-2 font-weight-bold btn-admin">Hủy</a>
                    <button type="submit" class="btn btn-admin btn-admin-primary">Lưu người dùng</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
