<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý đánh giá - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 style="font-weight: 800; letter-spacing: -1px;">QUẢN LÝ ĐÁNH GIÁ</h2>
            <p class="text-muted small m-0">Kiểm duyệt và phản hồi ý kiến từ khách hàng.</p>
        </div>
        <form method="get" class="form-inline m-0">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control mr-2" placeholder="Tìm kiếm mã hoặc tên...">
            <button class="btn btn-outline-dark" type="submit">Tìm</button>
        </form>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th class="pl-4">Khách hàng</th>
                            <th>Sản phẩm</th>
                            <th>Đánh giá</th>
                            <th>Nội dung</th>
                            <th>Ngày gửi</th>
                            <th class="text-right pr-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="review : ${reviews}">
                            <td class="pl-4">
                                <div style="font-weight: 700; color: #000;" th:text="${review.customerName}">Name</div>
                            </td>
                            <td>
                                <div class="small font-weight-bold text-truncate" style="max-width: 150px;" th:text="${review.product.name}">Product</div>
                            </td>
                            <td>
                                <span class="text-warning font-weight-bold" th:text="${review.rating} + ' ★'">5 ★</span>
                            </td>
                            <td>
                                <div class="small text-muted text-wrap" style="max-width: 300px;" th:text="${review.content}">Content</div>
                            </td>
                            <td class="small" th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy')}">Date</td>
                            <td class="text-right pr-4">
                                <a th:href="@{'/admin/reviews/delete/' + ${review.id}}" 
                                   class="btn btn-sm btn-outline-danger font-weight-bold"
                                   onclick="return confirm('Xác nhận xóa đánh giá này?')">XÓA</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <nav th:if="${totalPages > 1}" class="mt-4 mb-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, page=${currentPage - 1})}">Trang trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, page=${i})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, page=${currentPage + 1})}">Trang sau</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</section>
</body>
</html>
