<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Nhật ký hoạt động - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 style="font-weight: 800; letter-spacing: -1px;">NHẬT KÝ HOẠT ĐỘNG</h2>
            <p class="text-muted small m-0">Lịch sử các thao tác Thêm, Sửa, Xóa và cập nhật trạng thái trên hệ thống.</p>
        </div>
        <form method="get" class="form-inline m-0">
            <input type="date" name="date" th:value="${date}" class="form-control mr-2">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control mr-2" placeholder="Tìm người dùng, thao tác...">
            <button class="btn btn-outline-dark" type="submit">Lọc</button>
        </form>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th class="pl-4">Thời gian</th>
                            <th>Người dùng</th>
                            <th>Hành động</th>
                            <th>Đối tượng</th>
                            <th>ID Đối tượng</th>
                            <th class="pr-4">Chi tiết</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="6" class="text-center py-4 text-muted">Chưa có nhật ký hoạt động nào.</td>
                        </tr>
                        <tr th:each="log : ${logs}">
                            <td class="pl-4 text-muted small font-weight-bold" th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss')}">Time</td>
                            <td><span class="badge badge-dark p-2" th:text="${log.username}">User</span></td>
                            <td>
                                <span class="badge p-2" 
                                      th:classappend="${log.action == 'CREATE' ? 'badge-success' : (log.action == 'UPDATE' ? 'badge-primary' : (log.action == 'DELETE' ? 'badge-danger' : 'badge-warning'))}"
                                      th:text="${log.action}">Action</span>
                            </td>
                            <td class="font-weight-bold" th:text="${log.entityName}">Entity</td>
                            <td th:text="${log.entityId}">ID</td>
                            <td class="pr-4 small" th:text="${log.details}">Details</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <nav th:if="${totalPages > 1}" class="mt-4 mb-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{''(date=${date}, keyword=${keyword}, page=${currentPage - 1})}">Trang trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{''(date=${date}, keyword=${keyword}, page=${i})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{''(date=${date}, keyword=${keyword}, page=${currentPage + 1})}">Trang sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>
</body>
</html>
