<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý sản phẩm - Admin</title>
    <style>
        .product-thumb { width: 50px; height: 60px; object-fit: cover; border-radius: 4px; }
        .action-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-action { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: all 0.2s; border: 1px solid #eee; background: #fff; color: #555; }
        .btn-action:hover { border-color: #000; color: #000; background: #f9f9f9; }
        .btn-action-delete:hover { border-color: #dc3545; color: #dc3545; background: #fff5f5; }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-weight: 800; letter-spacing: -1px;">QUẢN LÝ SẢN PHẨM</h2>
        <div class="d-flex align-items-center">
            <form method="get" class="form-inline m-0">
                <select name="categoryId" class="form-control mr-2" onchange="this.form.submit()">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${categoryId == cat.id}"></option>
                </select>
                <input type="text" name="keyword" th:value="${keyword}" class="form-control mr-2" placeholder="Tìm kiếm mã hoặc tên...">
                <button class="btn btn-outline-dark" type="submit">Tìm</button>
            </form>
            <a th:href="@{/admin/products/add}" class="btn btn-admin btn-admin-primary ml-3">
                + THÊM SẢN PHẨM MỚI
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th class="pl-4">Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá bán</th>
                            <th>Kho</th>
                            <th class="text-right pr-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td class="pl-4">
                                <img th:src="${product.mainImageUrl}" class="product-thumb" alt="">
                            </td>
                            <td>
                                <div style="font-weight: 700; color: #000;" th:text="${product.name}">Name</div>
                                <div class="small text-muted" th:text="'ID: #' + ${product.id}">ID</div>
                            </td>
                            <td>
                                <span class="badge badge-light p-2" th:text="${product.category.name}">Category</span>
                            </td>
                            <td style="font-weight: 600;" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <span th:text="${product.stock}" class="font-weight-bold" th:classappend="${product.stock < 5 ? 'text-danger' : ''}">0</span>
                                    <span th:if="${product.stock < 5}" class="badge badge-danger ml-2" style="font-size: 0.65rem;">Sắp hết</span>
                                </div>
                            </td>
                            <td class="text-right pr-4">
                                <div class="action-btns">
                                    <a th:href="@{'/admin/products/edit/' + ${product.id}}" class="btn-action" title="Sửa">
                                        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 00 2 2h11a2 2 0 00 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    </a>
                                    <a th:href="@{'/admin/products/delete/' + ${product.id}}" class="btn-action btn-action-delete" title="Xóa" 
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')" sec:authorize="hasAuthority('ROLE_ADMIN')">
                                        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <nav th:if="${totalPages > 1}" class="mt-4 mb-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, categoryId=${categoryId}, page=${currentPage - 1})}">Trang trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, categoryId=${categoryId}, page=${i})}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{''(keyword=${keyword}, categoryId=${categoryId}, page=${currentPage + 1})}">Trang sau</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</section>
</body>
</html>
