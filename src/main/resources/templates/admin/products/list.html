<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Sản phẩm - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-family: 'Be Vietnam Pro', sans-serif; font-size: 2.5rem;">QUẢN LÝ SẢN PHẨM</h2>
        <a th:href="@{/admin/products/add}" class="btn btn-dark" style="border-radius: 8px;">+ THÊM SẢN PHẨM</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="thead-light">
                    <tr>
                        <th class="pl-4">ẢNH</th>
                        <th>TÊN SẢN PHẨM</th>
                        <th>DANH MỤC</th>
                        <th>GIÁ</th>
                        <th>TỒN KHO</th>
                        <th class="text-right pr-4">THAO TÁC</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td class="pl-4">
                            <img th:src="${p.mainImageUrl}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                        </td>
                        <td th:text="${p.name}" style="font-weight: 600;">Product Name</td>
                        <td th:text="${p.category.name}">Category</td>
                        <td th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</td>
                        <td th:text="${p.stock}" th:classappend="${p.stock < 10 ? 'text-danger font-weight-bold' : ''}">0</td>
                        <td class="text-right pr-4">
                            <a th:href="@{'/admin/products/edit/' + ${p.id}}" class="btn btn-sm btn-outline-primary mr-2">Sửa</a>
                            <a th:href="@{'/admin/products/delete/' + ${p.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xác nhận xóa sản phẩm này?')">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
