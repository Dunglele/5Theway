<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Thêm sản phẩm - Admin</title>
    <style>
        .page-header {
            background: linear-gradient(135deg, #111 0%, #333 100%);
            color: #fff;
            padding: 30px 40px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .page-header::after {
            content: '';
            position: absolute;
            top: -50%; right: -20%; width: 50%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            transform: rotate(15deg);
        }
        .page-header h2 { font-weight: 800; letter-spacing: -1px; margin: 0; position: relative; z-index: 1; }
        .page-header .back-link { color: rgba(255,255,255,0.7); font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; transition: color 0.2s; position: relative; z-index: 1;}
        .page-header .back-link:hover { color: #fff; }

        .form-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            padding: 30px;
        }
        .section-title {
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            color: #222;
        }

        .form-control, .custom-select {
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
            height: auto;
            font-size: 0.9rem;
            transition: all 0.2s;
            background: #fdfdfd;
        }
        select.form-control, select.custom-select {
            height: 48px !important;
            padding: 0 15px !important;
            line-height: 48px !important;
        }
        .form-control:focus, .custom-select:focus {
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
            border-color: #000;
            background: #fff;
        }
        label {
            font-weight: 700;
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .custom-file-upload {
            border: 2px dashed #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            cursor: pointer;
            border-radius: 12px;
            background: #fafafa;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .custom-file-upload:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .custom-file-upload input[type="file"] { display: none; }
        .custom-file-upload svg { margin-bottom: 10px; color: #888; z-index: 2; position: relative;}
        .custom-file-upload .upload-text { z-index: 2; position: relative; }
        
        .img-preview {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
            opacity: 0.5;
            z-index: 1;
            transition: opacity 0.3s;
        }
        .custom-file-upload:hover .img-preview {
            opacity: 0.2;
        }
        
        .switch-custom {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fff;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .switch-custom:hover { background: #fcfcfc; border-color: #ddd; }
        .switch-custom input { width: 18px; height: 18px; margin-right: 15px; cursor: pointer; }
        .switch-custom div { display: flex; flex-direction: column; }
        .switch-custom .title { font-weight: 700; font-size: 0.85rem; color: #222; }
        .switch-custom .desc { font-size: 0.75rem; color: #888; }

        .btn-submit {
            background: #000;
            color: #fff;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
        }
        .btn-submit:hover {
            background: #222;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="page-header">
        <a th:href="@{/admin/products}" class="back-link">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="mr-1"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Quay lại danh sách
        </a>
        <h2>THÊM SẢN PHẨM MỚI</h2>
    </div>

    <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
        <div class="row">
            <!-- Left Column: Main Info -->
            <div class="col-lg-8 mb-4">
                <div class="form-card mb-4">
                    <div class="section-title">Thông tin cơ bản</div>
                    
                    <div class="form-group mb-4">
                        <label>Tên sản phẩm <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm (VD: Áo Thun 5THEWAY...)" required>
                    </div>
                    
                    <div class="form-group mb-4">
                        <label>Mô tả ngắn</label>
                        <input type="text" th:field="*{shortDescription}" class="form-control" placeholder="Tóm tắt ngắn gọn hiển thị ở thẻ sản phẩm">
                    </div>
                    
                    <div class="form-group mb-0">
                        <label>Mô tả chi tiết</label>
                        <textarea th:field="*{description}" class="form-control" rows="6" placeholder="Nhập mô tả đầy đủ về chất liệu, kiểu dáng..."></textarea>
                    </div>
                </div>

                <div class="form-card mb-4">
                    <div class="section-title">Hình ảnh sản phẩm</div>
                    <div class="row">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label>Ảnh chính <span class="text-danger">*</span></label>
                            <label class="custom-file-upload w-100">
                                <img id="imagePreview" src="" class="img-preview" style="display: none;">
                                <input type="file" name="imageFile" accept="image/*" id="imageInput">
                                <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                                <span class="upload-text" style="font-weight: 600; font-size: 0.85rem; color: #444; margin-top: 5px;">Tải ảnh chính lên</span>
                                <span class="upload-text" style="font-size: 0.7rem; color: #999;">JPEG, PNG, WEBP</span>
                            </label>
                            <div class="mt-2 text-center text-muted" style="font-size: 0.8rem; font-weight: 600;">HOẶC</div>
                            <input type="text" th:field="*{mainImageUrl}" id="imageUrlInput" class="form-control mt-2" placeholder="Nhập URL ảnh chính">
                        </div>
                        <div class="col-md-6">
                            <label>Ảnh phụ (Gallery)</label>
                            <textarea th:field="*{additionalImages}" class="form-control" rows="4" placeholder="Nhập URL các ảnh phụ, cách nhau bởi dấu phẩy (,)"></textarea>
                            <small class="text-muted mt-1 d-block" style="font-size: 0.7rem;">Chức năng tải nhiều ảnh phụ sẽ được cập nhật sau. Tạm thời dùng URL.</small>
                        </div>
                    </div>
                </div>

                <div class="form-card">
                    <div class="section-title">Phân loại & Thuộc tính</div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-4">
                                <label>Màu sắc</label>
                                <input type="text" th:field="*{color}" class="form-control" placeholder="VD: Đen, Trắng, Navy...">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-4">
                                <label>Kích thước (Sizes)</label>
                                <input type="text" th:field="*{sizes}" class="form-control" placeholder="VD: S, M, L, XL">
                                <small class="text-muted d-block mt-1" style="font-size: 0.7rem;">Phân cách bằng dấu phẩy (,)</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Settings & Pricing -->
            <div class="col-lg-4">
                <div class="form-card mb-4">
                    <div class="section-title">Danh mục</div>
                    <div class="form-group mb-0">
                        <select name="category.id" class="custom-select form-control" required>
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${product.category != null and product.category.id == cat.id}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-card mb-4">
                    <div class="section-title">Giá & Kho</div>
                    <div class="form-group mb-3">
                        <label>Giá gốc (VNĐ) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" th:field="*{price}" class="form-control" placeholder="0" required>
                            <div class="input-group-append">
                                <span class="input-group-text bg-light border-left-0" style="font-weight: 600; font-size: 0.85rem;">đ</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label>Giá khuyến mãi (VNĐ)</label>
                        <div class="input-group">
                            <input type="number" th:field="*{salePrice}" class="form-control" placeholder="Để trống nếu không sale">
                            <div class="input-group-append">
                                <span class="input-group-text bg-light border-left-0" style="font-weight: 600; font-size: 0.85rem;">đ</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-0">
                        <label>Tồn kho <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{stock}" class="form-control" placeholder="0" required>
                    </div>
                </div>

                <div class="form-card mb-4">
                    <div class="section-title">Trạng thái hiển thị</div>
                    
                    <label class="switch-custom">
                        <input type="checkbox" th:field="*{featured}">
                        <div>
                            <span class="title">Sản phẩm nổi bật</span>
                            <span class="desc">Hiển thị ở khối to trên trang chủ</span>
                        </div>
                    </label>

                    <label class="switch-custom mb-0">
                        <input type="checkbox" th:field="*{newArrival}">
                        <div>
                            <span class="title">Sản phẩm mới (New)</span>
                            <span class="desc">Gắn badge 'New' trên thẻ sản phẩm</span>
                        </div>
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    LƯU SẢN PHẨM
                </button>
            </div>
        </div>
    </form>
</section>
<th:block layout:fragment="scripts">
    <script>
        const imageInput = document.getElementById('imageInput');
        const imageUrlInput = document.getElementById('imageUrlInput');
        const imagePreview = document.getElementById('imagePreview');

        function updatePreview(src) {
            if (src) {
                imagePreview.src = src;
                imagePreview.style.display = 'block';
            } else {
                imagePreview.src = '';
                imagePreview.style.display = 'none';
            }
        }

        imageInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    updatePreview(e.target.result);
                    imageUrlInput.value = ''; 
                }
                reader.readAsDataURL(this.files[0]);
            } else {
                updatePreview(imageUrlInput.value);
            }
        });

        imageUrlInput.addEventListener('input', function(e) {
            if (this.value) {
                updatePreview(this.value);
            } else {
                if(!imageInput.files || !imageInput.files[0]) {
                    imagePreview.style.display = 'none';
                }
            }
        });
    </script>
</th:block>
</body>
</html>
