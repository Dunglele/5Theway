<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý danh mục - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-weight: 800; letter-spacing: -1px;">QUẢN LÝ DANH MỤC</h2>
        <a th:href="@{/admin/categories/add}" class="btn btn-admin btn-admin-primary">
            + THÊM DANH MỤC MỚI
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th class="pl-4">ID</th>
                            <th>Tên danh mục</th>
                            <th>Đường dẫn (Slug)</th>
                            <th class="text-right pr-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="category : ${categories}">
                            <td class="pl-4 font-weight-bold" th:text="'#' + ${category.id}">#1</td>
                            <td style="font-weight: 700; color: #000;" th:text="${category.name}">Category Name</td>
                            <td class="text-muted" th:text="${category.slug}">slug</td>
                            <td class="text-right pr-4">
                                <div class="d-flex gap-2 justify-content-end" style="gap: 8px;">
                                    <a th:href="@{'/admin/categories/edit/' + ${category.id}}" class="btn btn-sm btn-outline-dark font-weight-bold">SỬA</a>
                                    <a th:href="@{'/admin/categories/delete/' + ${category.id}}" class="btn btn-sm btn-outline-danger font-weight-bold" 
                                       onclick="return confirm('Xác nhận xóa danh mục này? Tất cả sản phẩm thuộc danh mục sẽ bị ảnh hưởng.')">XÓA</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
