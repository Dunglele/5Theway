<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Danh mục - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-family: 'Bebas Neue', cursive; font-size: 2.5rem;">QUẢN LÝ DANH MỤC</h2>
        <a th:href="@{/admin/categories/add}" class="btn btn-dark" style="border-radius: 8px;">+ THÊM DANH MỤC</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="thead-light">
                    <tr>
                        <th class="pl-4">ID</th>
                        <th>TÊN DANH MỤC</th>
                        <th>SLUG</th>
                        <th class="text-right pr-4">THAO TÁC</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td class="pl-4" th:text="${cat.id}">1</td>
                        <td th:text="${cat.name}" style="font-weight: 600;">Category Name</td>
                        <td th:text="${cat.slug}">slug</td>
                        <td class="text-right pr-4">
                            <a th:href="@{'/admin/categories/edit/' + ${cat.id}}" class="btn btn-sm btn-outline-primary mr-2">Sửa</a>
                            <a th:href="@{'/admin/categories/delete/' + ${cat.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xác nhận xóa danh mục này? Tất cả sản phẩm thuộc danh mục sẽ bị ảnh hưởng.')">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
