<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Cập nhật Mã giảm giá - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="mb-4">
        <a th:href="@{/admin/coupons}" class="text-decoration-none text-muted mb-2 d-inline-block">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="mr-1"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Quay lại danh sách
        </a>
        <h2 style="font-weight: 800; letter-spacing: -1px;">CẬP NHẬT MÃ GIẢM GIÁ</h2>
    </div>

    <div class="card" style="max-width: 800px;">
        <div class="card-body p-4">
            <form th:action="@{/admin/coupons/save}" method="post" th:object="${coupon}">
                <input type="hidden" th:field="*{id}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Mã CODE (Bắt buộc)</label>
                        <input type="text" class="form-control" th:field="*{code}" required style="text-transform: uppercase;">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Trạng thái kích hoạt</label>
                        <select class="form-control" th:field="*{active}">
                            <option value="true" th:selected="*{active == true}">Hoạt động</option>
                            <option value="false" th:selected="*{active == false}">Vô hiệu hóa</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Loại giảm giá</label>
                        <select class="form-control" th:field="*{discountType}">
                            <option value="PERCENTAGE" th:selected="*{discountType == 'PERCENTAGE'}">Phần trăm (%)</option>
                            <option value="FIXED_AMOUNT" th:selected="*{discountType == 'FIXED_AMOUNT'}">Số tiền cố định (đ)</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Mức giảm</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{discountValue}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Đơn hàng tối thiểu (để được áp dụng)</label>
                        <input type="number" class="form-control" th:field="*{minOrderAmount}">
                        <small class="text-muted">Để trống hoặc 0 nếu không giới hạn.</small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Ngày hết hạn</label>
                        <input type="datetime-local" class="form-control" th:field="*{expiryDate}">
                        <small class="text-muted">Để trống nếu mã không có hạn.</small>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top text-right">
                    <a th:href="@{/admin/coupons}" class="btn btn-light mr-2 font-weight-bold">HỦY</a>
                    <button type="submit" class="btn btn-dark font-weight-bold px-4">LƯU CẬP NHẬT</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
