<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý đơn hàng - Admin</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-family: 'Be Vietnam Pro', sans-serif; font-size: 2.5rem;">QUẢN LÝ ĐƠN HÀNG</h2>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="thead-light">
                    <tr>
                        <th class="pl-4">ID</th>
                        <th>Khách hàng</th>
                        <th>Tổng tiền</th>
                        <th>Ngày đặt</th>
                        <th>Trạng thái</th>
                        <th class="text-right pr-4">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="pl-4" th:text="'#' + ${order.id}">#1</td>
                        <td>
                            <div style="font-weight: 600;" th:text="${order.fullName}">Name</div>
                            <small class="text-muted" th:text="${order.phoneNumber}"></small>
                        </td>
                        <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</td>
                        <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${order.status == 'PENDING' ? 'badge-warning' : (order.status == 'COMPLETED' ? 'badge-success' : 'badge-info')}"
                                  th:text="${order.status}">
                                STATUS
                            </span>
                        </td>
                        <td class="text-right pr-4">
                            <form th:action="@{/admin/orders/update-status}" method="post" class="d-inline-block">
                                <input type="hidden" name="orderId" th:value="${order.id}">
                                <select name="status" class="form-control form-control-sm d-inline-block w-auto" onchange="this.form.submit()">
                                    <option value="PENDING" th:selected="${order.status == 'PENDING'}">Chờ duyệt</option>
                                    <option value="CONFIRMED" th:selected="${order.status == 'CONFIRMED'}">Đã xác nhận</option>
                                    <option value="SHIPPING" th:selected="${order.status == 'SHIPPING'}">Đang giao</option>
                                    <option value="COMPLETED" th:selected="${order.status == 'COMPLETED'}">Hoàn thành</option>
                                    <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">Hủy đơn</option>
                                </select>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
